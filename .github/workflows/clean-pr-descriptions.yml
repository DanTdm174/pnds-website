# Removes the "Generated by Claude Code" footer from pull request descriptions.
# Runs automatically when a PR is opened or edited. To clean every existing PR at once,
# go to Actions → "Clean PR descriptions" → Run workflow.
name: Clean PR descriptions

on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7.0.1
        with:
          script: |
            // Trim footer lines from the end of the description: the "Generated by/with
            // Claude Code" line, a Claude session link, and any "---" or blank lines around them.
            const isFooter = (line) =>
              /Generated (by|with) \[Claude Code\]/i.test(line) ||
              /^\s*https:\/\/claude\.ai\/code\/session_\S+\s*$/.test(line);
            function strip(body) {
              const lines = body.split('\n');
              let removed = false;
              while (lines.length) {
                const last = lines[lines.length - 1];
                if (isFooter(last)) { lines.pop(); removed = true; continue; }
                if (/^\s*$/.test(last) || (removed && /^\s*---\s*$/.test(last))) { lines.pop(); continue; }
                break;
              }
              return lines.join('\n');
            }

            async function clean(pr) {
              const body = pr.body || '';
              const cleaned = strip(body);
              if (cleaned === body.trimEnd()) return;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: cleaned,
              });
              core.info(`Cleaned #${pr.number}`);
            }

            if (context.eventName === 'workflow_dispatch') {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              });
              for (const pr of prs) await clean(pr);
            } else {
              await clean(context.payload.pull_request);
            }
